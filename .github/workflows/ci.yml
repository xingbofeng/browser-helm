name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck-lint-unit:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build extension
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e-and-package:
    name: E2E Tests & Landing Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run zip

      - name: Run E2E tests
        run: npm run test:e2e:no-build

      - name: Package extension for landing download
        run: npm run build:landing:from-existing

      - name: Upload landing artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-helm-landing
          path: dist/landing/browser-helm-latest.zip
          retention-days: 14

  deploy-landing:
    name: Deploy Landing To Vercel
    runs-on: ubuntu-latest
    needs: [typecheck-lint-unit, e2e-and-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_z1U7nQd2Kmp1caxCG4fuM2XF
      VERCEL_PROJECT_ID: prj_XHg4WBtZ0eXZWR5mYWnXRTfH7v6n
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment production --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Build landing output for Vercel
        run: vercel build --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt landing to production
        run: vercel deploy --prebuilt --prod --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
