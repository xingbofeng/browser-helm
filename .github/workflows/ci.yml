name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck-lint-unit:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e-and-package:
    name: E2E Tests & Landing Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run zip

      - name: Run E2E tests
        run: npm run test:e2e:no-build

      - name: Package extension for landing download
        run: npm run build:landing

      - name: Upload landing artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-helm-landing
          path: dist/landing/browser-helm-latest.zip
          retention-days: 14
