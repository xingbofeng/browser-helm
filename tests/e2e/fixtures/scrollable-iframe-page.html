<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>可滚动 iframe 测试页</title></head>
<body>
<main>
<h1>可滚动 iframe 测试</h1>
<iframe id="scrollable-frame" src="iframe-scroll-content.html"
        style="width:100%;height:400px;border:1px solid #ccc;"
        sandbox="allow-same-origin allow-scripts">
</iframe>
<p>上面的 iframe 包含长内容，需要滚动才能完全读取。</p>
<iframe id="cross-origin-frame" src="https://example.com/"
        style="width:100%;height:300px;border:1px solid red;">
</iframe>
<p>上面的跨域 iframe 应返回结构化 limitation。</p>
</main>
</body>
</html>
