<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision Overlay Fixture</title>
  <style>
    body {
      margin: 0;
      min-height: 140vh;
      font-family: system-ui, sans-serif;
      background: #f7f8fb;
      color: #18202f;
    }

    main {
      padding: 32px;
    }

    .target-card {
      max-width: 520px;
      padding: 20px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #ffffff;
    }

    .target-card button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #165dff;
      color: #ffffff;
      font-weight: 600;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(18, 25, 38, 0.58);
      z-index: 20;
    }

    .dialog {
      width: min(420px, calc(100vw - 32px));
      padding: 20px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 20px 54px rgba(18, 25, 38, 0.28);
    }

    .dialog h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .dialog button {
      margin-top: 16px;
      padding: 9px 12px;
      border: 0;
      border-radius: 6px;
      background: #172033;
      color: #ffffff;
    }

    .overlay[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="target-card" aria-labelledby="target-title">
      <h1 id="target-title">被遮挡的操作区</h1>
      <p>这个 fixture 用于验证 screenshot、vision fallback 和 pointer fallback。</p>
      <button id="primary-action" type="button">继续操作</button>
      <button id="pay-action" type="button">Pay now</button>
    </section>
  </main>

  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <div class="dialog">
      <h1 id="overlay-title">视觉遮挡层</h1>
      <p>这个浮层覆盖页面主要按钮，DOM/a11y 仍可读，但视觉点击路径需要谨慎处理。</p>
      <button id="dismiss-overlay" type="button">关闭遮挡层</button>
    </div>
  </div>

  <script>
    window.__visionClickCount = 0;
    document.getElementById('dismiss-overlay').addEventListener('click', () => {
      window.__visionClickCount += 1;
      document.getElementById('overlay').hidden = true;
      document.body.dataset.overlayDismissed = 'true';
    });
  </script>
</body>
</html>
