<!doctype html>
<html>
  <head>
    <title>提交按钮禁用示例</title>
  </head>
  <body>
    <h1>资料确认</h1>
    <form>
      <label>
        姓名
        <input id="name" name="name" required value="" />
      </label>
      <label>
        <input id="terms" name="terms" type="checkbox" required />
        我同意服务条款
      </label>
      <button id="submit" type="submit" disabled>提交资料</button>
    </form>
  </body>
</html>
