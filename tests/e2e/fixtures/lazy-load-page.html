<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>延迟加载测试页</title>
<style>
  .lazy-section { display: none; }
  .lazy-section.visible { display: block; }
  .lazy-image, .lazy-bg {
    width: 320px;
    height: 180px;
    border: 1px solid #8aa;
    margin: 12px 0;
  }
  .lazy-bg {
    background: #eef;
    background-size: cover;
  }
</style>
</head>
<body>
<main>
<h1>延迟加载内容测试</h1>
<div id="initial"><p>初始可见内容。浏览器应能看到这段文字。</p></div>
<div id="lazy-1" class="lazy-section"><p>首次滚动后出现的延迟内容段落一。包含足够多的文字来验证页面读取是否真正获取到了这些文字。浏览器需要等待稳定后再观察。</p></div>
<div id="lazy-2" class="lazy-section">
  <p>二次滚动后出现的延迟内容段落二。这部分内容在初始加载时不可见，只有用户滚动到此处才会变得可见。这模拟了典型的无限滚动或 lazy-load 场景。</p>
  <img id="lazy-product-image" class="lazy-image" data-src="/media/lazy-product.png" alt="Lazy product image" width="320" height="180">
  <div id="lazy-background-image" class="lazy-bg" data-bg="/media/lazy-background.png" role="img" aria-label="Lazy background image"></div>
</div>
<div id="spacer" style="height: 2000px;"></div>
</main>
<footer><p>BrowserHelm E2E Test Fixture — lazy-load</p></footer>
<script>
window.__lazyImageLoaded = false;
window.__lazyBackgroundLoaded = false;

function checkScroll() {
  if (window.scrollY > 150) {
    document.querySelector('#lazy-1')?.classList.add('visible');
  }
  if (window.scrollY > 600) {
    document.querySelector('#lazy-2')?.classList.add('visible');
  }
  const image = document.querySelector('#lazy-product-image');
  if (image && image.closest('.lazy-section')?.classList.contains('visible') && !image.getAttribute('src')) {
    image.setAttribute('src', image.getAttribute('data-src'));
    window.__lazyImageLoaded = true;
  }
  const background = document.querySelector('#lazy-background-image');
  if (background && background.closest('.lazy-section')?.classList.contains('visible') && !background.style.backgroundImage) {
    background.style.backgroundImage = 'url("' + background.getAttribute('data-bg') + '")';
    window.__lazyBackgroundLoaded = true;
  }
}
window.addEventListener('scroll', checkScroll);
checkScroll();
</script>
</body>
</html>
